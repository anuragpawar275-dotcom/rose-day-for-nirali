<!DOCTYPE html>
<html>
<head>
    <title>Happy Rose Day 🌹</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .active {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: #b3003b;
            font-size: 42px;
            z-index: 2;
        }

        .rose {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .pickup-line {
            margin-top: 40px;
            font-size: 26px;
            color: #660033;
            padding: 20px;
            text-align: center;
        }

        .btn {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #ff4d6d;
            color: white;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #e6004c;
        }

        .heart {
            position: absolute;
            font-size: 22px;
            animation: explode 1.5s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2) translate(var(--x), var(--y)); opacity: 0; }
        }

        .photo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 20px;
            border: 5px solid #b3003b;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<!-- MAIN PAGE -->
<div id="mainPage" class="page active">
    <h1>Happy Rose Day Nirali 🌹</h1>
</div>

<!-- PICKUP PAGE -->
<div id="pickupPage" class="page">
    <div class="pickup-line" id="line"></div>
    <div id="photoContainer"></div>
    <button class="btn" onclick="goBack()">Pick another rose 🌹</button>
</div>

<script>
    const pickupLines = [
        "Are you a rose? Kyunki tum meri duniya ko khilaa deti ho 🌹",
        "When you smile, dil automatically happy ho jata hai ❤️",
        "Tum sirf beautiful nahi ho… you’re truly special ✨",
        "Every rose reminds me of you — soft, sweet, and unforgettable 🌸",
        "Sach kahun? You make my world brighter 💖",
        "Tumhari smile is my favorite notification 😌",
        "You don’t just look pretty… tum dil bhi jeet leti ho 💕"
    ];

    const totalRoses = 12;

    for (let i = 0; i < totalRoses; i++) {
        const rose = document.createElement("div");
        rose.className = "rose";
        rose.innerHTML = "🌹";

        const angle = (i / totalRoses) * 2 * Math.PI;
        const radius = 200;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        rose.style.left = (centerX + radius * Math.cos(angle)) + "px";
        rose.style.top = (centerY + radius * Math.sin(angle)) + "px";

        if (i === totalRoses - 1) {
            rose.style.fontSize = "50px";
            rose.onclick = function () {
                document.getElementById("line").innerHTML =
                    "Ek rose ko main kya hi ek rose du… you deserve a whole garden 🌹❤️ <br><br>– Anurag";

                // Show her photo
                document.getElementById("photoContainer").innerHTML =
                    '<img src="nirali.jpg" class="photo">';  // Change file name here

                showFireworks();
                switchPage();
            };
        } else {
            rose.onclick = function () {
                const randomLine = pickupLines[Math.floor(Math.random() * pickupLines.length)];
                document.getElementById("line").innerHTML = randomLine;
                document.getElementById("photoContainer").innerHTML = "";
                showFireworks();
                switchPage();
            };
        }

        document.getElementById("mainPage").appendChild(rose);
    }

    function switchPage() {
        document.getElementById("mainPage").classList.remove("active");
        document.getElementById("pickupPage").classList.add("active");
    }

    function goBack() {
        document.getElementById("pickupPage").classList.remove("active");
        document.getElementById("mainPage").classList.add("active");
        document.getElementById("photoContainer").innerHTML = "";
    }

    function showFireworks() {
        for (let i = 0; i < 40; i++) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = Math.random() * window.innerHeight + "px";
            heart.style.setProperty("--x", (Math.random() * 400 - 200) + "px");
            heart.style.setProperty("--y", (Math.random() * 400 - 200) + "px");
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 1500);
        }
    }
</script>

</body>
</html>
