<!DOCTYPE html>
<html>
<head>
    <title>Happy Rose Day 🌹</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #b3003b;
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .active {
            display: block;
        }

        .rose {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .pickup-line {
            margin-top: 120px;
            font-size: 26px;
            color: #660033;
            padding: 20px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #ff4d6d;
            color: white;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #e6004c;
        }

        .heart {
            position: absolute;
            font-size: 22px;
            animation: explode 1.5s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2) translate(var(--x), var(--y)); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- MAIN PAGE -->
<div id="mainPage" class="page active">
    <h1>Happy Rose Day Nirali 🌹</h1>
    <p>Pick a rose 💖</p>
</div>

<!-- PICKUP PAGE -->
<div id="pickupPage" class="page">
    <div class="pickup-line" id="line"></div>
    <button class="btn" onclick="goBack()">Pick another rose 🌹</button>
</div>

<script>
    const pickupLines = [
        "Are you a rose? Because you made my world bloom 🌹💖",
        "If beauty had a name, it would be Nirali ✨😍",
        "You’re rare, beautiful, and unforgettable 💕🌸",
        "Some roses are special… like you 😉🌹"
    ];

    // Create floating roses
    for (let i = 0; i < 8; i++) {
        const rose = document.createElement("div");
        rose.className = "rose";
        rose.innerHTML = "🌹";
        rose.style.left = Math.random() * 90 + "vw";
        rose.style.top = Math.random() * 70 + 120 + "px";
        rose.style.animationDelay = Math.random() * 2 + "s";
        rose.onclick = openPickup;
        document.getElementById("mainPage").appendChild(rose);
    }

    function openPickup() {
        const randomLine = pickupLines[Math.floor(Math.random() * pickupLines.length)];
        document.getElementById("line").innerHTML = randomLine;

        showFireworks();

        document.getElementById("mainPage").classList.remove("active");
        document.getElementById("pickupPage").classList.add("active");
    }

    function goBack() {
        document.getElementById("pickupPage").classList.remove("active");
        document.getElementById("mainPage").classList.add("active");
    }

    function showFireworks() {
        for (let i = 0; i < 40; i++) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = Math.random() * window.innerHeight + "px";
            heart.style.setProperty("--x", (Math.random() * 400 - 200) + "px");
            heart.style.setProperty("--y", (Math.random() * 400 - 200) + "px");
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 1500);
        }
    }
</script>

</body>
</html>
