<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day Nirali 🌹</title>

<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ffe6ec, #ffd6e0);
}

/* Pages */
.page {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
}

.active {
    display: block;
}

/* Center Title */
h1 {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    color: #b3003b;
    z-index: 5;
    text-align: center;
}

/* Roses */
.rose-wrapper {
    position: absolute;
    text-align: center;
    cursor: pointer;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
}

.rose {
    font-size: 34px;
    transition: transform 0.3s ease;
}

.rose:hover {
    transform: scale(1.3);
}

.number {
    font-size: 14px;
    color: #b3003b;
}

/* Pickup Page */
#pickupPage {
    display: none;
    background: #fff0f5;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

#pickupPage.active {
    display: flex;
}

#line {
    font-size: 22px;
    color: #b3003b;
    padding: 20px;
    max-width: 90%;
}

.photo {
    width: 220px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

button {
    margin-top: 25px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

/* Heart Fireworks */
.heart {
    position: absolute;
    font-size: 20px;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2) translate(var(--x), var(--y)); opacity: 0; }
}
</style>
</head>

<body>

<div id="mainPage" class="page active">
    <h1>Happy Rose Day Nirali 🌹</h1>
</div>

<div id="pickupPage" class="page">
    <div id="line"></div>
    <div id="photoContainer"></div>
    <button onclick="goBack()">Pick another rose 🌹</button>
</div>

<script>

const pickupLines = [
    "Are you a rose? Kyunki tum meri duniya ko khilaa deti ho 🌹",
    "When you smile, dil automatically happy ho jata hai ❤️",
    "Tum sirf beautiful nahi ho… you’re truly special ✨",
    "Every rose reminds me of you — soft, sweet, and unforgettable 🌸",
    "Sach kahun? You make my world brighter 💖",
    "Tumhari smile is my favorite notification 😌",
    "You don’t just look pretty… tum dil bhi jeet leti ho 💕"
];

const totalRoses = 10;
const safeTop = window.innerHeight * 0.30;
const safeBottom = window.innerHeight * 0.55;

for (let i = 0; i < totalRoses; i++) {

    const wrapper = document.createElement("div");
    wrapper.className = "rose-wrapper";

    let x = Math.random() * (window.innerWidth - 50);
    let y;

    do {
        y = Math.random() * (window.innerHeight - 50);
    } while (y > safeTop && y < safeBottom);

    wrapper.style.left = x + "px";
    wrapper.style.top = y + "px";

    const rose = document.createElement("div");
    rose.className = "rose";
    rose.innerHTML = "🌹";

    const number = document.createElement("div");
    number.className = "number";
    number.innerHTML = i + 1;

    wrapper.appendChild(rose);
    wrapper.appendChild(number);

    wrapper.onclick = function(e) {

        showFireworks(e.pageX, e.pageY);

        if (i === totalRoses - 1) {
            document.getElementById("line").innerHTML =
                "Ek rose ko main kya hi ek rose du… you deserve a whole garden 🌹❤️ <br><br>– Anurag";

            document.getElementById("photoContainer").innerHTML =
                '<img src="nirali.jpg" class="photo">';
        } else {
            const randomLine = pickupLines[Math.floor(Math.random() * pickupLines.length)];
            document.getElementById("line").innerHTML = randomLine;
            document.getElementById("photoContainer").innerHTML = "";
        }

        switchPage();
    };

    document.getElementById("mainPage").appendChild(wrapper);
}

function showFireworks(x, y) {
    for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = x + "px";
        heart.style.top = y + "px";
        heart.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
        heart.style.setProperty("--y", (Math.random() * 200 - 100) + "px");
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 1200);
    }
}

function switchPage() {
    document.getElementById("mainPage").classList.remove("active");
    document.getElementById("pickupPage").classList.add("active");
}

function goBack() {
    document.getElementById("pickupPage").classList.remove("active");
    document.getElementById("mainPage").classList.add("active");
}

</script>

</body>
</html>
