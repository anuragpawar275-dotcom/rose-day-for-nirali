<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day Nirali 🌹</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #fdf2f5;
    text-align: center;
}

.page {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
}

.active {
    display: block;
}

h1 {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    color: #b3003b;
    z-index: 2;
}

.rose {
    font-size: 40px;
    transition: transform 0.3s;
}

.rose:hover {
    transform: scale(1.3);
}

.number {
    font-size: 14px;
    color: #b3003b;
}

#pickupPage {
    display: none;
    background: #fff0f5;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#pickupPage.active {
    display: flex;
}

#line {
    font-size: 22px;
    margin: 20px;
    color: #b3003b;
}

.photo {
    width: 220px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(179,0,59,0.5);
}

button {
    padding: 10px 20px;
    background: #b3003b;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #80002a;
}

.heart {
    position: absolute;
    font-size: 20px;
    animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
    from { transform: translate(0,0); opacity: 1; }
    to { transform: translate(var(--x), var(--y)); opacity: 0; }
}
</style>
</head>

<body>

<div id="mainPage" class="page active">
    <h1>Happy Rose Day Nirali 🌹</h1>
</div>

<div id="pickupPage" class="page">
    <div id="line"></div>
    <div id="photoContainer"></div>
    <button onclick="goBack()">Back</button>
</div>

<script>
const pickupLines = [
    "Are you a rose? Kyunki tum meri duniya ko khilaa deti ho 🌹",
    "When you smile, dil automatically happy ho jata hai ❤️",
    "Tum sirf beautiful nahi ho… you’re truly special ✨",
    "Every rose reminds me of you — soft, sweet, and unforgettable 🌸",
    "Sach kahun? You make my world brighter 💖",
    "Tumhari smile is my favorite notification 😌",
    "You don’t just look pretty… tum dil bhi jeet leti ho 💕"
];

const totalRoses = 12;
const centerX = window.innerWidth / 2;
const centerY = window.innerHeight / 2;

const safeWidth = 500;
const safeHeight = 200;

for (let i = 0; i < totalRoses; i++) {

    const wrapper = document.createElement("div");
    wrapper.style.position = "absolute";
    wrapper.style.textAlign = "center";
    wrapper.style.cursor = "pointer";

    let x, y;

    do {
        x = Math.random() * window.innerWidth;
        y = Math.random() * window.innerHeight;
    } while (
        x > centerX - safeWidth/2 &&
        x < centerX + safeWidth/2 &&
        y > centerY - safeHeight/2 &&
        y < centerY + safeHeight/2
    );

    wrapper.style.left = x + "px";
    wrapper.style.top = y + "px";

    const rose = document.createElement("div");
    rose.className = "rose";
    rose.innerHTML = "🌹";

    const number = document.createElement("div");
    number.className = "number";
    number.innerHTML = i + 1;

    wrapper.appendChild(rose);
    wrapper.appendChild(number);

    if (i === totalRoses - 1) {
        rose.style.fontSize = "50px";

        wrapper.onclick = function() {
            document.getElementById("line").innerHTML =
                "Ek rose ko main kya hi ek rose du… you deserve a whole garden 🌹❤️ <br><br>– Anurag";

            document.getElementById("photoContainer").innerHTML =
                '<img src="nirali.jpg" class="photo">';

            showFireworks();
            switchPage();
        };
    } else {
        wrapper.onclick = function() {
            const randomLine = pickupLines[Math.floor(Math.random() * pickupLines.length)];
            document.getElementById("line").innerHTML = randomLine;
            document.getElementById("photoContainer").innerHTML = "";
            showFireworks();
            switchPage();
        };
    }

    document.getElementById("mainPage").appendChild(wrapper);
}

function switchPage() {
    document.getElementById("mainPage").classList.remove("active");
    document.getElementById("pickupPage").classList.add("active");
}

function goBack() {
    document.getElementById("pickupPage").classList.remove("active");
    document.getElementById("mainPage").classList.add("active");
    document.getElementById("photoContainer").innerHTML = "";
}

function showFireworks() {
    for (let i = 0; i < 40; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = Math.random() * window.innerHeight + "px";
        heart.style.setProperty("--x", (Math.random() * 400 - 200) + "px");
        heart.style.setProperty("--y", (Math.random() * 400 - 200) + "px");
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
    }
}
</script>

</body>
</html>
