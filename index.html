<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day Nirali 🌹</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #fdf2f5;
    text-align: center;
}

.page {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
}

.active {
    display: block;
}

h1 {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    color: #b3003b;
    z-index: 2;
}

.rose {
    font-size: 38px;
    transition: transform 0.3s;
}

.rose:hover {
    transform: scale(1.3);
}

.number {
    font-size: 14px;
    color: #b3003b;
}

#pickupPage {
    display: none;
    background: #fff0f5;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#pickupPage.active {
    display: flex;
}

#line {
    font-size: 22px;
    margin: 20px;
    color: #b3003b;
}

.photo {
    width: 220px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(179,0,59,0.5);
}

button {
    padding: 10px 20px;
    background: #b3003b;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="mainPage" class="page active">
    <h1>Happy Rose Day Nirali 🌹</h1>
</div>

<div id="pickupPage" class="page">
    <div id="line"></div>
    <div id="photoContainer"></div>
    <button onclick="goBack()">Back</button>
</div>

    const x = scale * 16 * Math.pow(Math.sin(t), 3);

        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

    wrapper.style.position = "absolute";
    wrapper.style.left = centerX + x + "px";
    wrapper.style.top = centerY + y - 120 + "px"; // shift up to avoid text
    wrapper.style.textAlign = "center";
    wrapper.style.cursor = "pointer";

    rose.innerHTML = "🌹";

    const number = document.createElement("div");
    number.className = "number";
    number.innerHTML = i + 1;

    wrapper.appendChild(number);
